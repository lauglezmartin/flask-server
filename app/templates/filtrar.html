{% extends "base.html" %}

{% block title %}Filtrar{% endblock %}

{% block content %}
<h1>Filtrar Productos</h1>
<p>filtrar por precio:</p>
<form action="/filtrar-data" method="get">
    <p>
        <label for="precio_min">Precio mínimo:</label>
        <input type="number" id="precio_min" name="precio_min" step="10">
    </p>
    <p>
        <label for="precio_max">Precio máximo:</label>
        <input type="number" id="precio_max" name="precio_max" step="10">
    </p>
    <p>
        <input type="submit" value="Filtrar">
    </p>
</form>
{% endblock %}
